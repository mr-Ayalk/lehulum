<!DOCTYPE html>
<!-- FR-CAP-01, FR-CAP-04: Tap-to-time caption editor. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caption timer — LE HULUM</title>
<link rel="stylesheet" href="../demo.css">
<script>var t=new URLSearchParams(location.search).get("theme");if(t==="light"||t==="dark"||t==="contrast")document.documentElement.dataset.theme=t;</script>
<style>
.stage{position:relative;max-width:40rem;background:#000}
.stage video{width:100%;display:block}
.cap{position:absolute;left:50%;bottom:.75rem;transform:translateX(-50%);max-width:92%;margin:0;padding:.5rem 1rem;border-radius:6px;background:var(--lh-cap-bg);color:var(--lh-cap-text);text-align:center;font-size:1.25rem}
.cap strong{color:var(--lh-cap-speaker)}
.cap[lang="am"]{font-family:var(--lh-font-ethiopic);line-height:1.7}
.say{font-size:1.5rem;line-height:1.4;margin:.4rem 0}
.tap{min-height:4rem;width:100%;margin:.5rem 0;font:700 1.25rem/1.2 var(--lh-font-latin);background:var(--lh-accent);color:var(--lh-on-accent);border:0;border-radius:var(--lh-radius-md)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0}
.row button{min-height:44px;min-width:44px;padding:0 .8rem;border-radius:var(--lh-radius-md);border:1px solid var(--lh-border);background:var(--lh-surface);color:var(--lh-text);font:600 1rem var(--lh-font-latin)}
.row button[aria-pressed="true"]{background:var(--lh-highlight);color:var(--lh-on-highlight)}
label{display:block;margin:.8rem 0 .25rem;font-weight:700}
input[type="file"],input[type="range"]{display:block;max-width:24rem;min-height:44px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.4rem;border-bottom:1px solid var(--lh-line);vertical-align:top}
tr[aria-current="true"]{background:var(--lh-highlight);color:var(--lh-on-highlight)}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header>
  <div class="bar">
    <a class="logo" href="../index.html"><span class="mark" aria-hidden="true"><i></i></span><span class="brand"><b>LE HULUM</b><span lang="am">ለሁሉም</span></span></a>
    <div class="tools"><button type="button" id="theme">Light</button></div>
  </div>
</header>
<main id="main">
  <h1>Caption timer</h1>
  <p>Play the lesson and mark when each line starts. Press N anywhere except a form field. Space or Enter does it while “Next line starts now” is focused.</p>
  <label for="video-file">Video file</label>
  <input id="video-file" type="file" accept="video/*">
  <p class="note">Leave this empty to use the lesson video.</p>
  <label for="text-file">Text list, CSV with id, text_am, text_en</label>
  <input id="text-file" type="file" accept=".csv,text/csv">
  <div class="stage">
    <video id="vid" controls playsinline preload="metadata" src="../data/lesson.mp4" aria-label="Lesson video">
      <track kind="captions" src="../data/lesson.en.vtt" srclang="en" label="English">
    </video>
    <p id="cap" class="cap" hidden></p>
  </div>
  <p class="say" id="now">Current: —</p>
  <p class="say" id="upcoming">Next: …</p>
  <button type="button" class="tap" id="tap">Next line starts now</button>
  <label for="offset">Reaction offset <span id="offset-val">0.15 s</span></label>
  <input id="offset" type="range" min="0" max="0.4" step="0.05" value="0.15">
  <div class="row">
    <button type="button" id="restart">Restart</button>
    <button type="button" id="undo">Undo last tap</button>
    <button type="button" id="play">Play</button>
    <button type="button" id="speech-end">End of speech</button>
  </div>
  <div class="row" role="group" aria-label="Playback speed">
    <button type="button" data-rate="1" aria-pressed="true">1x</button>
    <button type="button" data-rate="0.75" aria-pressed="false">0.75x</button>
    <button type="button" data-rate="0.5" aria-pressed="false">0.5x</button>
  </div>
  <div class="row">
    <button type="button" id="preview">Preview</button>
    <button type="button" id="dl-am">Download VTT (am)</button>
    <button type="button" id="dl-en">Download VTT (en)</button>
  </div>
  <p id="live" role="status"></p>
  <div class="wrap">
    <table>
      <caption>Line times</caption>
      <thead><tr><th scope="col">Id</th><th scope="col">Start</th><th scope="col">End</th><th scope="col">English</th></tr></thead>
      <tbody id="times"></tbody>
    </table>
  </div>
</main>
<footer><a href="../index.html">Home</a></footer>
<script type="module" src="caption-timer.js"></script>
<script src="../demo.js"></script>
</body>
</html>
