<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:{{ pad }};background:#FAF8F3;border-bottom:1px solid #D9D3C7;font-family:'Atkinson Hyperlegible','Noto Sans Ethiopic',sans-serif;color:#1C1B18">
  <a href="#" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#1C1B18;min-height:44px">
    <span aria-hidden="true" style="width:32px;height:32px;border-radius:8px;background:#0A6B4E;display:flex;align-items:center;justify-content:center"><span style="width:12px;height:12px;border-radius:50%;background:#FAF8F3"></span></span>
    <span style="display:flex;flex-direction:column;line-height:1.1"><span style="font-weight:700;font-size:18px;letter-spacing:.04em">LE HULUM</span><span lang="am" style="font-family:'Noto Sans Ethiopic';font-size:14px">ለሁሉም</span></span>
  </a>
  <sc-if value="{{ desktop }}" hint-placeholder-val="{{ true }}">
    <nav aria-label="Main" style="display:flex;gap:4px">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="#" aria-current="{{ l.current }}" style="{{ l.style }}">{{ l.label }}</a>
      </sc-for>
    </nav>
  </sc-if>
  <div style="display:flex;gap:8px">
    <button style="min-height:44px;padding:0 14px;border-radius:8px;background:#FFFFFF;border:1px solid #8A8478;color:#1C1B18;font:600 16px 'Noto Sans Ethiopic','Atkinson Hyperlegible'">{{ langLabel }}</button>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}">
      <button aria-expanded="false" style="min-height:44px;padding:0 14px;border-radius:8px;background:#1C1B18;border:0;color:#FAF8F3;font:700 16px 'Atkinson Hyperlegible','Noto Sans Ethiopic'">☰ {{ menuLabel }}</button>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:72},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;am&quot;],&quot;default&quot;:&quot;en&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;video&quot;,&quot;text&quot;,&quot;jobs&quot;,&quot;docs&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = !!this.props.mobile, am = this.props.lang === 'am', act = this.props.active || 'home';
    const items = [['home','Home','መነሻ'],['video','Video lesson','የቪዲዮ ትምህርት'],['text','Text lesson','የጽሑፍ ትምህርት'],['jobs','Jobs','ሥራዎች'],['docs','API docs','API ሰነዶች']];
    const links = items.map(([k,en,a]) => { const c = k === act; return { label: am ? a : en, current: c ? 'page' : undefined,
      style: `min-height:44px;display:flex;align-items:center;padding:0 14px;border-radius:8px;font-size:17px;text-decoration:${c?'underline':'none'};text-underline-offset:6px;text-decoration-thickness:3px;font-weight:${c?700:400};color:#1C1B18;background:${c?'#F1EDE4':'transparent'}` }; });
    return { desktop: !m, mobile: m, links, pad: m ? '8px 12px' : '12px 40px', langLabel: am ? 'English' : 'አማርኛ', menuLabel: am ? 'ምናሌ' : 'Menu' };
  }
}
</script>
</body>
</html>
