# C-02, INT-02, FR-HOH-02: Serve Savanna, the module and the demo, and proxy /api/.
server {
    listen 80;
    server_name _;
    charset utf-8;

    location / {
        root /srv/savanna;
        index index.html;
    }

    location /module/ {
        alias /srv/module/;
        add_header Cache-Control "no-cache";
    }

    location /demo/ {
        alias /srv/demo/;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
    }
}
